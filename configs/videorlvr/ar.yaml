# VideoRLVR maze + flowfree + sokoban pure autoregressive baseline.
# Two GPUs x batch 1 x gradient accumulation 8 = global batch 16.
# Prepared data should be combined with:
#   python3 utils/prepare_videorlvr_data.py --overwrite

infra:
  sequence_parallel_size: 1
  sharding_strategy: full
  mixed_precision: true
  gradient_checkpointing: true
  vae_halo_latents: 0
  generator_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 4
  local_attn_size: -1

algorithm:
  trainer: diffusion
  i2v: true
  causal: true
  teacher_forcing: true
  independent_first_frame: true
  num_train_timestep: 1000
  denoising_loss_type: flow

training:
  lr: 5.0e-06
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  batch_size: 1
  gradient_accumulation_steps: 8
  ema_weight: 0.0
  ema_start_step: 100000000
  log_iters: 1000
  max_checkpoints: 20
  max_iters: 5000
  gc_interval: 100
  allow_padding: true
  min_latent_frames: 4
  uniform_prompt: true
  variable_length: true
  task_balanced_sampling: true
  dataset_sample_warning_seconds: 10
  dataset_sample_warning_interval_seconds: 30
  reset_rng_after_init: true
  error_recycling:
    enabled: false

data:
  data_path: ./data/videorlvr-datasets-3tasks
  eval_data_path: ./data/videorlvr-test-3tasks
  target_fps: 8
  image_or_video_shape:
  - 1
  - 24
  - 48
  - 30
  - 52
  load_raw_video: true

inference:
  sampling_steps: 20
  sink_size: 1
  multi_shot_sink: true
  multi_shot_rope_offset: 4
  guidance_scale: 3.0
  independent_first_frame: true
  negative_prompt: '细节模糊不清，风格，作品，画作，画面，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的'

evaluation:
  interval: 500
  num_frames: 24
  match_gt_length: false
  max_num_frames: 24
  samples_per_task: 3
  max_samples: 9
  use_ema: false
  val_batch_size: 1
  save_latents_only: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: AR-VideoRLVR-All-Acc16
