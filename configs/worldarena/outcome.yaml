# WorldArena Outcome stage (steps 0-7,000).
# Two GPUs x batch 1 x gradient accumulation 8 = global batch 16.

infra:
  sequence_parallel_size: 1
  sharding_strategy: full
  mixed_precision: true
  gradient_checkpointing: true
  vae_halo_latents: 0
  generator_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: -1

algorithm:
  trainer: diffusion
  i2v: true
  causal: true
  teacher_forcing: true
  independent_first_frame: true
  future_lookahead: true
  lookahead_layout: goal_frame
  lookahead_current_attends_endpoint: true
  lookahead_first_current_attends_endpoint: true
  lookahead_goal_attends_current: false
  lookahead_goal_attends_i2v_context: true
  endpoint_loss_weight: 0.25
  share_endpoint_noise_across_replicas: true
  num_train_timestep: 1000
  denoising_loss_type: flow

training:
  lr: 5.0e-06
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  batch_size: 1
  gradient_accumulation_steps: 8
  ema_weight: 0.0
  ema_start_step: 100000000
  log_iters: 1000
  max_checkpoints: 3
  max_iters: 7000
  gc_interval: 100
  allow_padding: true
  min_latent_frames: 8
  uniform_prompt: true
  variable_length: true
  task_balanced_sampling: true
  dataset_sample_warning_seconds: 10
  dataset_sample_warning_interval_seconds: 30
  reset_rng_after_init: true
  error_recycling:
    enabled: false

data:
  data_path: ./data/worldarena-train
  eval_data_path: ./data/worldarena-test
  target_fps: 24
  image_or_video_shape: [1, 32, 48, 30, 40]
  load_raw_video: true

inference:
  disable_lookahead: false
  sampling_steps: 20
  local_attn_size: 21
  sink_size: 4
  multi_shot_sink: true
  multi_shot_rope_offset: 4
  guidance_scale: 3.0
  independent_first_frame: true
  negative_prompt: '细节模糊不清，静态，形变，机械臂变形，最差质量，低质量，JPEG压缩残留'

evaluation:
  interval: 500
  num_frames: 32
  match_gt_length: true
  max_num_frames: 32
  random_task_count: 20
  samples_per_task: 1
  max_samples: 20
  output_pixel_frames: 121
  output_frame_sampling: head
  use_ema: false
  val_batch_size: 1
  save_latents_only: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: ProAR-WorldArena-Outcome
